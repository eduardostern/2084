<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" fill="none" stroke="#2a2a2a" stroke-linecap="round" stroke-linejoin="round">
  <!-- Ch.12 2085: a sheet of paper with a pen — hand-drawn style -->
  <!-- paper sheet with slightly uneven edges -->
  <path d="M58 18 C60 17.5, 138 18.5, 142 18 L143 100 C141 100.5, 60 101, 58 100.5 Z" stroke-width="1.0"/>
  <!-- paper edge shadow -->
  <path d="M60 20 L140 20" stroke-width="0.3" opacity="0.15"/>
  <!-- a single handwritten line — the last line -->
  <path d="M70 44 C73 42, 76 44, 79 42.5 C82 44, 85 42, 88 43.5 C91 42, 94 44, 97 42.5 C100 44, 103 42, 106 43.5 C109 42, 112 44, 115 42.5 C118 44, 121 42, 124 43" stroke-width="0.7" opacity="0.8"/>
  <!-- faint earlier lines above (suggesting finished writing) -->
  <path d="M70 32 C80 31, 90 32.5, 100 31.5 C110 32, 118 31, 125 32" stroke-width="0.35" opacity="0.25"/>
  <path d="M70 36 C78 35, 86 36.5, 94 35.5 C102 36, 108 35, 114 36" stroke-width="0.35" opacity="0.25"/>
  <path d="M70 40 C82 39, 94 40.5, 106 39.5 C114 40, 120 39, 128 40" stroke-width="0.35" opacity="0.25"/>
  <!-- pen lying diagonally across the lower part of the page -->
  <path d="M45 98 C50 95, 60 88, 70 82 C80 76, 90 70, 100 64 C108 59, 114 56, 118 53" stroke-width="2.2"/>
  <!-- pen barrel taper -->
  <path d="M118 53 C120 52, 123 50.5, 126 49.5" stroke-width="1.5"/>
  <!-- pen nib -->
  <path d="M126 49.5 L130 48" stroke-width="0.8"/>
  <path d="M130 48 L132 47.5" stroke-width="0.5"/>
  <!-- pen cap end -->
  <path d="M45 98 C43 99.5, 41 100, 39 100.5" stroke-width="1.8"/>
  <path d="M39 100.5 L37 101" stroke-width="1.0"/>
  <!-- ink tip detail -->
  <circle cx="132" cy="47.5" r="1" fill="#2a2a2a" opacity="0.7"/>
  <!-- small ink mark near nib as if just lifted -->
  <path d="M127 50 C128 49, 129 48.5, 130 48" stroke-width="0.4" opacity="0.4"/>
  <!-- paper texture hatching in bottom area -->
  <path d="M65 85 L68 88" stroke-width="0.25" opacity="0.12"/>
  <path d="M75 80 L78 83" stroke-width="0.25" opacity="0.12"/>
  <path d="M85 75 L88 78" stroke-width="0.25" opacity="0.12"/>
  <path d="M130 90 L133 93" stroke-width="0.25" opacity="0.12"/>
  <path d="M135 85 L137 88" stroke-width="0.25" opacity="0.12"/>
</svg>
