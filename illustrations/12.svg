<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" fill="none" stroke="#2a2a2a" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">
  <!-- Ch.12 2085: a sheet of paper with a pen lying diagonally, a single line of text -->
  <!-- paper sheet -->
  <rect x="55" y="20" width="90" height="80"/>
  <!-- a single handwritten line -->
  <path d="M66 48 q4 -3 8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0 t8 0" stroke-width="0.7"/>
  <!-- pen lying across -->
  <line x1="40" y1="95" x2="120" y2="55" stroke-width="2"/>
  <line x1="120" y1="55" x2="128" y2="51" stroke-width="1.2"/>
  <line x1="128" y1="51" x2="133" y2="49"/>
  <!-- pen tip -->
  <path d="M40 95 l-5 3 l1 -5 z" fill="#2a2a2a"/>
</svg>
