<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" fill="none" stroke="#2a2a2a" stroke-width="1.1" stroke-linecap="round" stroke-linejoin="round">
  <!-- Ch.1 The Optimized Morning: window at dawn with Day Path constellation -->
  <rect x="55" y="30" width="90" height="70" rx="1"/>
  <line x1="100" y1="30" x2="100" y2="100"/>
  <line x1="55" y1="65" x2="145" y2="65"/>
  <!-- horizon inside window -->
  <line x1="60" y1="82" x2="140" y2="82" stroke-width="0.8"/>
  <!-- rising sun -->
  <path d="M80 82 a10 10 0 0 1 20 0"/>
  <!-- constellation above window -->
  <circle cx="85" cy="16" r="1.4" fill="#2a2a2a"/>
  <circle cx="100" cy="10" r="1.4" fill="#2a2a2a"/>
  <circle cx="118" cy="18" r="1.4" fill="#2a2a2a"/>
  <circle cx="128" cy="8" r="1.4" fill="#2a2a2a"/>
  <line x1="85" y1="16" x2="100" y2="10" stroke-width="0.6" opacity="0.6"/>
  <line x1="100" y1="10" x2="118" y2="18" stroke-width="0.6" opacity="0.6"/>
  <line x1="118" y1="18" x2="128" y2="8" stroke-width="0.6" opacity="0.6"/>
</svg>
