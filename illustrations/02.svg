  <path d="M122 60 L125 63 L122 66.5 L119 63 Z" stroke-width="0.8" fill="#2a2a2a" opacity="0.85"/>
  <path d="M138 44 L141 47 L138 50.5 L135 47 Z" stroke-width="0.8" fill="#2a2a2a" opacity="0.85"/>
