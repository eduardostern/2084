<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" fill="none" stroke="#2a2a2a" stroke-linecap="round" stroke-linejoin="round">
  <!-- Ch.6 Flesh and Data: the Band ring with DNA helix — hand-drawn style -->
  <!-- ring (ellipse, slightly wobbly, viewed from slight angle) -->
  <path d="M62 60 C62 48, 78 40, 100 40 C122 40, 138 48, 138 60 C138 72, 122 80, 100 80 C78 80, 62 72, 62 60" stroke-width="1.3"/>
  <!-- inner ring edge -->
  <path d="M68 60 C68 50, 82 44, 100 44 C118 44, 132 50, 132 60 C132 70, 118 76, 100 76 C82 76, 68 70, 68 60" stroke-width="0.6" opacity="0.5"/>
  <!-- helix strand 1 — passing through ring -->
  <path d="M70 15 C78 22, 92 30, 98 40 C104 50, 96 58, 100 65 C104 72, 92 80, 98 88 C104 96, 92 104, 86 112" stroke-width="0.9"/>
  <!-- helix strand 2 — crossing -->
  <path d="M130 15 C122 22, 108 30, 102 40 C96 50, 104 58, 100 65 C96 72, 108 80, 102 88 C96 96, 108 104, 114 112" stroke-width="0.9"/>
  <!-- rungs between strands -->
  <path d="M78 22 L122 22" stroke-width="0.4" opacity="0.5"/>
  <path d="M86 29 L114 29" stroke-width="0.4" opacity="0.5"/>
  <path d="M96 50 L104 50" stroke-width="0.4" opacity="0.5"/>
  <path d="M104 72 L96 72" stroke-width="0.4" opacity="0.5"/>
  <path d="M96 88 L104 88" stroke-width="0.4" opacity="0.5"/>
  <path d="M92 96 L108 96" stroke-width="0.4" opacity="0.5"/>
  <!-- tiny marks suggesting data/cells shed near the ring -->
  <circle cx="55" cy="55" r="0.8" fill="#2a2a2a" opacity="0.4"/>
  <circle cx="58" cy="68" r="0.6" fill="#2a2a2a" opacity="0.3"/>
  <circle cx="142" cy="52" r="0.7" fill="#2a2a2a" opacity="0.35"/>
  <circle cx="145" cy="65" r="0.6" fill="#2a2a2a" opacity="0.3"/>
  <circle cx="50" cy="62" r="0.5" fill="#2a2a2a" opacity="0.25"/>
  <circle cx="148" cy="58" r="0.5" fill="#2a2a2a" opacity="0.25"/>
</svg>
