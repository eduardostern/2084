<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 120" fill="none" stroke="#2a2a2a" stroke-linecap="round" stroke-linejoin="round">
  <!-- Ch.7 The Cartography of Disobedience: descending staircase with figure — hand-drawn style -->
  <!-- staircase with wobbly hand-drawn lines -->
  <path d="M35 28 C37 28, 62 27.5, 65 28 L65 38 C65 38, 88 37.5, 90 38 L90 50 C90 50, 113 49.5, 115 50 L115 62 C115 62, 138 61.5, 140 62 L140 75 C140 75, 163 74.5, 165 75" stroke-width="1.2"/>
  <!-- vertical risers with slight wobble -->
  <path d="M65 28 L65.5 38" stroke-width="1.0"/>
  <path d="M90 38 L90.5 50" stroke-width="1.0"/>
  <path d="M115 50 L115.5 62" stroke-width="1.0"/>
  <path d="M140 62 L140.5 75" stroke-width="1.0"/>
  <!-- left wall going down -->
  <path d="M35 28 L35 105" stroke-width="0.8"/>
  <!-- right edge going down -->
  <path d="M165 75 L165 105" stroke-width="0.8"/>
  <!-- floor -->
  <path d="M35 105 C60 104.5, 100 105.5, 140 104.8 C155 105.2, 163 105, 165 105" stroke-width="0.8"/>
  <!-- hatching on stair faces for depth -->
  <path d="M66 30 L66 37" stroke-width="0.3" opacity="0.3"/>
  <path d="M70 30 L70 37" stroke-width="0.3" opacity="0.3"/>
  <path d="M75 30 L75 37" stroke-width="0.3" opacity="0.3"/>
  <path d="M91 40 L91 49" stroke-width="0.3" opacity="0.3"/>
  <path d="M96 40 L96 49" stroke-width="0.3" opacity="0.3"/>
  <path d="M101 40 L101 49" stroke-width="0.3" opacity="0.3"/>
  <path d="M116 52 L116 61" stroke-width="0.3" opacity="0.3"/>
  <path d="M121 52 L121 61" stroke-width="0.3" opacity="0.3"/>
  <path d="M126 52 L126 61" stroke-width="0.3" opacity="0.3"/>
  <path d="M141 64 L141 74" stroke-width="0.3" opacity="0.3"/>
  <path d="M146 64 L146 74" stroke-width="0.3" opacity="0.3"/>
  <path d="M151 64 L151 74" stroke-width="0.3" opacity="0.3"/>
  <!-- small figure at the top of stairs -->
  <path d="M48 21 C46 19, 46 16, 48 14.5 C50 16, 50 19, 48 21" stroke-width="0.7"/>
  <path d="M47.5 21 L47.5 27" stroke-width="0.6"/>
  <path d="M47.5 23 L45 26" stroke-width="0.5"/>
  <path d="M47.5 23 L50 26" stroke-width="0.5"/>
  <!-- light beam from below -->
  <path d="M160 105 L175 85" stroke-width="0.3" opacity="0.2"/>
  <path d="M155 105 L172 82" stroke-width="0.3" opacity="0.15"/>
  <path d="M150 105 L168 80" stroke-width="0.3" opacity="0.1"/>
</svg>
